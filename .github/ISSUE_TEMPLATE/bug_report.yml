name: Bug 报告
description: 功能异常、崩溃、显示或性能问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量把信息填完整，尤其是设备型号和系统版本 —— 手表 ROM 差异很大，
        没有这些信息通常无法复现。

        如果是**安全漏洞**，请不要在这里提交，改用
        [私密报告](https://github.com/xumidcm/Flue/security/advisories/new)。

  - type: input
    id: version
    attributes:
      label: Flue 版本
      description: 设置 → 关于 里的版本名与版本号
      placeholder: 2.3.5 (30)
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备与系统
      description: 手表型号 + Android/Wear OS 版本
      placeholder: OPPO Watch X，Wear OS 4（Android 13）
    validations:
      required: true

  - type: dropdown
    id: screen
    attributes:
      label: 屏幕形态
      options:
        - 圆屏
        - 方屏
        - 不确定
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开设置 → 表盘管理
        2. 切换到 XX 表盘
        3. 返回首页
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有截图或录屏请直接拖进来
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志（可选）
      description: |
        可用 `adb logcat -s Flue:* AndroidRuntime:E` 抓取。上传前请自行检查是否包含隐私信息。

  - type: dropdown
    id: frequency
    attributes:
      label: 复现频率
      options:
        - 必现
        - 偶现
        - 只出现过一次
